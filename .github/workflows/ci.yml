name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # npm の Trusted Publishing (OIDC) で publish するために必要
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release が自身のトークンで push するため、
          # checkout 側の認証情報は残さない
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted Publishing が使えない場合のフォールバック。
          # npm 側で Trusted Publisher を設定済みなら未設定のままでよい
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
